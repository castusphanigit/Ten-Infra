name: Terraform Plan

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  detect-environments:
    name: Detect Environments
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.detect.outputs.env_list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect .tfvars files
        id: detect
        run: |
          files=$(ls *.tfvars 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "No tfvars files found, skipping..."
            echo "env_list=[]" >> $GITHUB_OUTPUT
          else
            envs=$(echo "$files" | sed 's/.tfvars//g' | jq -R -s -c 'split("\n")[:-1]')
            echo "Detected environments: $envs"
            echo "env_list=$envs" >> $GITHUB_OUTPUT
          fi

  terraform-plan:
    name: Terraform Plan
    needs: detect-environments
    if: ${{ fromJson(needs.detect-environments.outputs.environments) != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJson(needs.detect-environments.outputs.environments) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::593002333172:role/BE_Github_Actions
          aws-region: ap-south-1
          role-session-name: github-actions

      - name: Terraform Init
        run: terraform init \
          -backend-config="bucket=ten-terraform-statefile" \
          -backend-config="key=terraform/${{ matrix.env }}/terraform.tfstate" \
          -backend-config="region=ap-south-1" \
          -backend-config="encrypt=true" \
          -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file="${{ matrix.env }}.tfvars" -out=tfplan-${{ matrix.env }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: tfplan-${{ matrix.env }}

      - name: Post Plan Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: Terraform Plan (${{ matrix.env }})
          message: |
            ### Terraform Plan for **${{ matrix.env }}**
            ```
            ${{ steps.plan.outputs.stdout }}
            ```
