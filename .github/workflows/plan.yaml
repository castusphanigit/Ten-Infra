name: Terraform Apply

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  detect-environments:
    name: Detect Environments
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.detect.outputs.env_list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect .tfvars files
        id: detect
        run: |
          files=$(ls *.tfvars 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "No tfvars files found, skipping..."
            echo "env_list=[]" >> $GITHUB_OUTPUT
          else
            envs=$(echo "$files" | sed 's/.tfvars//g' | jq -R -s -c 'split("\n")[:-1]')
            echo "Detected environments: $envs"
            echo "env_list=$envs" >> $GITHUB_OUTPUT
          fi

  terraform-apply:
    name: Terraform Apply
    needs: detect-environments
    if: ${{ fromJson(needs.detect-environments.outputs.environments) != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJson(needs.detect-environments.outputs.environments) }}
    environment: ${{ matrix.env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::593002333172:role/BE_Github_Actions
          aws-region: ap-south-1
          role-session-name: github-actions

      - name: Terraform Init
        run: terraform init \
          -backend-config="bucket=ten-terraform-statefile" \
          -backend-config="key=terraform/${{ matrix.env }}/terraform.tfstate" \
          -backend-config="region=ap-south-1" \
          -backend-config="encrypt=true" \
          -reconfigure

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: .

      - name: Terraform Apply (Dev/QA)
        if: ${{ matrix.env == 'dev' || matrix.env == 'qa' }}
        run: terraform apply -auto-approve tfplan-${{ matrix.env }}

      - name: Terraform Apply (UAT/Prod)
        if: ${{ matrix.env == 'uat' || matrix.env == 'prod' }}
        run: terraform apply tfplan-${{ matrix.env }}
