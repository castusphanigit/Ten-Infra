name: Terraform Apply

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: []
    strategy:
      matrix:
        env: [dev, qa, uat, prod]

    environment: ${{ matrix.env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if tfvars exists
        id: check_tfvars
        run: |
          if [ -f "${{ matrix.env }}.tfvars" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        if: steps.check_tfvars.outputs.exists == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials via OIDC
        if: steps.check_tfvars.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::593002333172:role/BE_Github_Actions
          aws-region: ap-south-1
          role-session-name: github-actions

      - name: Terraform Init
        if: steps.check_tfvars.outputs.exists == 'true'
        run: terraform init \
          -backend-config="bucket=ten-terraform-statefile" \
          -backend-config="key=terraform/${{ matrix.env }}/terraform.tfstate" \
          -backend-config="region=ap-south-1" \
          -backend-config="encrypt=true" \
          -reconfigure

      - name: Download Plan Artifact
        if: steps.check_tfvars.outputs.exists == 'true'
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: .

      - name: Terraform Apply (Dev/QA)
        if: steps.check_tfvars.outputs.exists == 'true' && (matrix.env == 'dev' || matrix.env == 'qa')
        run: terraform apply -auto-approve tfplan-${{ matrix.env }}

      - name: Terraform Apply (UAT/Prod - Manual Approval)
        if: steps.check_tfvars.outputs.exists == 'true' && (matrix.env == 'uat' || matrix.env == 'prod')
        run: terraform apply tfplan-${{ matrix.env }}
