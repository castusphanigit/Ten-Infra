name: Terraform Deploy with OIDC, Validation & Manual Approval

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, qa, uat, prod]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::593002333172:role/BE_Github_Actions
          aws-region: ap-south-1

      - name: Check if tfvars exists
        id: check_tfvars
        run: |
          if [ -f "${{ matrix.env }}.tfvars" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        if: steps.check_tfvars.outputs.exists == 'true'
        run: |
          terraform init \
            -backend-config="bucket=ten-terraform-statefile" \
            -backend-config="key=terraform/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -reconfigure

      - name: Terraform Validate
        if: steps.check_tfvars.outputs.exists == 'true'
        run: terraform validate

      - name: Terraform Plan
        if: steps.check_tfvars.outputs.exists == 'true'
        run: terraform plan -var-file="${{ matrix.env }}.tfvars" -out=tfplan

      - name: Upload tfplan artifact
        if: steps.check_tfvars.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: tfplan

  terraform-apply-dev:
    name: Apply Dev/QA
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: ${{ always() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::593002333172:role/BE_Github_Actions
          aws-region: ap-south-1

      - name: Apply Dev tfplan
        if: ${{ always() && (github.ref == 'refs/heads/main') && ( ( 'dev.tfvars' || 'qa.tfvars' ) ) }}
        run: |
          for env in dev qa; do
            if [ -f "$env.tfvars" ]; then
              echo "Applying $env..."
              gh actions download-artifact --name tfplan-$env --path . || true
              terraform apply -auto-approve tfplan
            fi
          done

  terraform-apply-uat-prod:
    name: Apply UAT/PROD
    runs-on: ubuntu-latest
    needs: terraform-plan
    strategy:
      matrix:
        env: [uat, prod]
    environment: ${{ matrix.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::593002333172:role/BE_Github_Actions
          aws-region: ap-south-1

      - name: Download tfplan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: .

      - name: Terraform Apply (UAT/PROD)
        run: terraform apply tfplan
        # GitHub will pause here if the environment requires manual approval
