name: Terraform Deploy with OIDC, Validation & Manual Approval

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, qa, uat, prod]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::593002333172:role/BE_Github_Actions
          aws-region: ap-south-1

      - name: Check if tfvars exists
        id: check_tfvars
        run: |
          if [ -f "${{ matrix.env }}.tfvars" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        if: steps.check_tfvars.outputs.exists == 'true'
        run: |
          terraform init \
            -backend-config="bucket=ten-terraform-statefile" \
            -backend-config="key=terraform/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -reconfigure

      - name: Terraform Validate
        if: steps.check_tfvars.outputs.exists == 'true'
        run: terraform validate

      - name: Terraform Plan
        if: steps.check_tfvars.outputs.exists == 'true'
        run: terraform plan -var-file="${{ matrix.env }}.tfvars" -out=tfplan

      - name: Upload tfplan artifact
        if: steps.check_tfvars.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: tfplan

  terraform-apply-dev:
    name: Terraform Apply (dev/qa)
    runs-on: ubuntu-latest
    needs: terraform-plan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::593002333172:role/BE_Github_Actions
          aws-region: ap-south-1

      - name: Download tfplan (dev)
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: .
        continue-on-error: true

      - name: Apply dev.tfvars
        if: steps.download-tfplan.outputs != ''
        run: terraform apply -auto-approve tfplan

      - name: Download tfplan (qa)
        uses: actions/download-artifact@v4
        with:
          name: tfplan-qa
          path: .
        continue-on-error: true

      - name: Apply qa.tfvars
        if: steps.download-tfplan.outputs != ''
        run: terraform apply -auto-approve tfplan

  terraform-apply-uat-prod:
    name: Terraform Apply (uat/prod)
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: ${{ github.event.inputs.env || 'uat-prod' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::593002333172:role/BE_Github_Actions
          aws-region: ap-south-1

      - name: Download tfplan (uat)
        uses: actions/download-artifact@v4
        with:
          name: tfplan-uat
          path: .
        continue-on-error: true

      - name: Apply uat.tfvars
        if: steps.download-tfplan.outputs != ''
        run: terraform apply tfplan

      - name: Download tfplan (prod)
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: .
        continue-on-error: true

      - name: Apply prod.tfvars
        if: steps.download-tfplan.outputs != ''
        run: terraform apply tfplan
