name: Terraform Deploy with OIDC, Validation & Manual Approval

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  detect-envs:
    name: Detect Environments
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.set-envs.outputs.envs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Detect available .tfvars
        id: set-envs
        run: |
          # Detect .tfvars files and remove extension
          ENVS=$(ls *.tfvars 2>/dev/null | sed 's/\.tfvars//g' | jq -R -s -c 'split("\n")[:-1]')
          if [ -z "$ENVS" ]; then
            ENVS='[]'
          fi
          echo "Detected environments: $ENVS"
          echo "envs=$ENVS" >> $GITHUB_OUTPUT

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: detect-envs
    strategy:
      matrix:
        env: ${{ fromJSON(needs.detect-envs.outputs.envs) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::593002333172:role/BE_Github_Actions
          aws-region: ap-south-1

      - name: Check if tfvars exists
        id: check_tfvars
        run: |
          if [ -f "${{ matrix.env }}.tfvars" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        if: steps.check_tfvars.outputs.exists == 'true'
        run: |
          terraform init \
            -backend-config="bucket=ten-terraform-statefile" \
            -backend-config="key=terraform/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -reconfigure

      - name: Terraform Validate
        if: steps.check_tfvars.outputs.exists == 'true'
        run: terraform validate

      - name: Terraform Plan
        if: steps.check_tfvars.outputs.exists == 'true'
        run: terraform plan -var-file="${{ matrix.env }}.tfvars" -out=tfplan

      - name: Upload tfplan artifact
        if: steps.check_tfvars.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: tfplan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    strategy:
      matrix:
        env: ${{ fromJSON(needs.detect-envs.outputs.envs) }}
    environment: ${{ matrix.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::593002333172:role/BE_Github_Actions
          aws-region: ap-south-1

      - name: Download tfplan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: .

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        # Auto-approve runs for dev/qa
        # Manual approval is enforced automatically by GitHub environment protection rules for uat/prod
